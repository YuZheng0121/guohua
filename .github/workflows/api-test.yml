name: api-tests

on:
  push:
    branches: [master, main]
    paths:
      - 'api-tests/**'
      - '.github/workflows/api-test.yml'
  pull_request:
    paths:
      - 'api-tests/**'
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-tests
    strategy:
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: api-tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        run: |
          python -m pytest -q -rx \
            --html=test-output/report.html --self-contained-html \
            --junitxml=test-output/junit.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-output-py${{ matrix.python-version }}
          path: api-tests/test-output/
          retention-days: 14

  e2e-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api-tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run E2E tests
        run: python -m pytest -q -m e2e --html=test-output/e2e-report.html --self-contained-html

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: api-tests/test-output/
          retention-days: 14
