<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明清仕女图典藏 - 中国绘画分析系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: #f5f5f0;
        }

        /* 顶部导航 */
        .header {
            background: linear-gradient(135deg, #8b4513 0%, #a0522d 100%);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #d2691e;
        }
        .header h1 { font-size: 24px; font-weight: normal; }
        .header .subtitle { font-size: 14px; opacity: 0.9; }

        /* 导航栏 */
        .nav {
            background: #fff;
            padding: 12px 30px;
            display: flex;
            gap: 30px;
            border-bottom: 1px solid #ddd;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .nav a {
            color: #333;
            text-decoration: none;
            font-size: 15px;
            padding: 5px 0;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        .nav a:hover, .nav a.active {
            color: #8b4513;
            border-bottom-color: #8b4513;
        }

        /* 主体 */
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        /* 统计卡片 */
        .stats-bar {
            background: white;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .stat-item { text-align: center; }
        .stat-number { font-size: 28px; font-weight: bold; color: #8b4513; }
        .stat-label { font-size: 12px; color: #666; margin-top: 4px; }

        /* 工具栏 */
        .toolbar {
            background: white;
            border-radius: 8px;
            padding: 12px 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .result-count { color: #666; font-size: 13px; }
        .search-box {
            padding: 8px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            width: 250px;
        }

        /* 图片网格 */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .painting-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .painting-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .painting-image {
            width: 100%;
            height: 220px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 64px;
            position: relative;
        }
        .painting-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .person-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(139, 69, 19, 0.9);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
        }
        .painting-info { padding: 12px; }
        .painting-title {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 6px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .painting-meta { font-size: 12px; color: #666; line-height: 1.6; }
        .painting-dynasty {
            display: inline-block;
            padding: 2px 8px;
            background: #f5e6d3;
            color: #8b4513;
            border-radius: 3px;
            font-size: 11px;
            margin-top: 6px;
        }
        .copyright-badge {
            display: inline-block;
            padding: 2px 8px;
            background: #d4edda;
            color: #155724;
            border-radius: 3px;
            font-size: 11px;
            margin-top: 6px;
            margin-left: 5px;
        }

        /* 主体布局 */
        .main-layout {
            display: flex;
            gap: 20px;
        }

        /* 左侧筛选栏 */
        .filter-sidebar {
            width: 260px;
            flex-shrink: 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .filter-header {
            padding: 15px;
            background: #f9f9f9;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .filter-header span {
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }
        .filter-header a {
            font-size: 12px;
            color: #8b4513;
            text-decoration: none;
        }
        .filter-header a:hover {
            text-decoration: underline;
        }
        .filter-section {
            border-bottom: 1px solid #eee;
        }
        .filter-title {
            padding: 12px 15px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: background 0.3s;
        }
        .filter-title:hover {
            background: #f9f9f9;
        }
        .filter-title span:first-child {
            font-size: 14px;
            color: #333;
        }
        .filter-count {
            margin-left: 5px;
            font-size: 12px;
            color: #999;
        }
        .arrow {
            margin-left: auto;
            font-size: 14px;
            color: #999;
            transition: transform 0.3s;
        }
        .filter-title.expanded .arrow {
            transform: rotate(90deg);
        }
        .filter-options {
            display: none;
            padding: 0 15px 15px;
        }
        .filter-options.show {
            display: block;
        }
        .filter-option {
            display: flex;
            align-items: center;
            padding: 6px 0;
            font-size: 13px;
            color: #555;
            cursor: pointer;
        }
        .filter-option:hover {
            color: #8b4513;
        }
        .filter-option input {
            margin-right: 8px;
        }
        .filter-option .count {
            margin-left: auto;
            font-size: 12px;
            color: #999;
        }

        /* 右侧内容区 */
        .content-area {
            flex: 1;
            min-width: 0;
        }

        /* 图表 */
        .charts-section {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
        }
        .chart-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .chart-card h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        /* 详情弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
        }
        .modal-close {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        .modal-close:hover { color: #333; }
        .modal-title { font-size: 20px; color: #333; margin-bottom: 20px; }
        .modal-body { display: flex; gap: 30px; }
        .modal-image { flex: 1; }
        .modal-image img { width: 100%; border-radius: 8px; }
        .modal-info { flex: 1; }
        .modal-field {
            padding: 12px;
            background: #f9f9f9;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .modal-field label { font-size: 12px; color: #666; display: block; margin-bottom: 4px; }
        .modal-field span { font-size: 14px; color: #333; }
        .modal-labels { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .modal-label {
            padding: 4px 10px;
            background: #e8e8e8;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>明清仕女图典藏</h1>
            <div class="subtitle">52幅明清仕女图 · 多模型AI检测结果</div>
        </div>
        <div>
            <a href="/" style="color: white; text-decoration: none; font-size: 14px;">← 返回主系统</a>
        </div>
    </div>

    <div class="nav">
        <a href="/">统计概览</a>
        <a href="/images">图片查看</a>
        <a href="/shinu" class="active">明清仕女图</a>
    </div>

    <div class="container">
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-number">52</div>
                <div class="stat-label">总作品数</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">448</div>
                <div class="stat-label">检测人物数</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">100%</div>
                <div class="stat-label">人物识别率</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">15</div>
                <div class="stat-label">作者数量</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">10</div>
                <div class="stat-label">公开版权</div>
            </div>
        </div>

        <div class="main-layout">
            <!-- 左侧筛选栏 -->
            <div class="filter-sidebar">
                <div class="filter-header">
                    <span>查询条件</span>
                    <a href="#" onclick="resetAllFilters(); return false;">重新查询</a>
                </div>

                <div class="filter-section">
                    <div class="filter-title" onclick="toggleSection(this)">
                        <span>时代</span>
                        <span class="filter-count">(2)</span>
                        <span class="arrow">›</span>
                    </div>
                    <div class="filter-options">
                        <label class="filter-option">
                            <input type="checkbox" checked onchange="applyFilters()" data-filter="dynasty" value="明代"> 明代
                            <span class="count">(19)</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" checked onchange="applyFilters()" data-filter="dynasty" value="清代"> 清代
                            <span class="count">(33)</span>
                        </label>
                    </div>
                </div>

                <div class="filter-section">
                    <div class="filter-title" onclick="toggleSection(this)">
                        <span>版权状态</span>
                        <span class="filter-count">(2)</span>
                        <span class="arrow">›</span>
                    </div>
                    <div class="filter-options">
                        <label class="filter-option">
                            <input type="checkbox" checked onchange="applyFilters()" data-filter="copyright" value="是"> 有公开版权
                            <span class="count">(10)</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" checked onchange="applyFilters()" data-filter="copyright" value="否"> 无公开版权
                            <span class="count">(42)</span>
                        </label>
                    </div>
                </div>

                <div class="filter-section">
                    <div class="filter-title" onclick="toggleSection(this)">
                        <span>作者</span>
                        <span class="filter-count">(5)</span>
                        <span class="arrow">›</span>
                    </div>
                    <div class="filter-options">
                        <label class="filter-option">
                            <input type="checkbox" checked onchange="applyFilters()" data-filter="author" value="吴嘉猷"> 吴嘉猷
                            <span class="count">(12)</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" checked onchange="applyFilters()" data-filter="author" value="杜堇"> 杜堇
                            <span class="count">(10)</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" checked onchange="applyFilters()" data-filter="author" value="佚名"> 佚名
                            <span class="count">(7)</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" checked onchange="applyFilters()" data-filter="author" value="李廷薰"> 李廷薰
                            <span class="count">(4)</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" checked onchange="applyFilters()" data-filter="author" value="其他"> 其他
                            <span class="count">(19)</span>
                        </label>
                    </div>
                </div>

                <div class="filter-section">
                    <div class="filter-title" onclick="toggleSection(this)">
                        <span>收藏机构</span>
                        <span class="filter-count">(4)</span>
                        <span class="arrow">›</span>
                    </div>
                    <div class="filter-options">
                        <label class="filter-option">
                            <input type="checkbox" checked onchange="applyFilters()" data-filter="institution" value="上海博物馆"> 上海博物馆
                            <span class="count">(25)</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" checked onchange="applyFilters()" data-filter="institution" value="大英博物馆"> 大英博物馆
                            <span class="count">(6)</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" checked onchange="applyFilters()" data-filter="institution" value="故宫博物院"> 故宫博物院
                            <span class="count">(4)</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" checked onchange="applyFilters()" data-filter="institution" value="其他"> 其他
                            <span class="count">(17)</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 右侧内容区 -->
            <div class="content-area">
                <div class="toolbar">
                    <div class="result-count">共 <strong id="resultCount">52</strong> 笔</div>
                    <input type="text" class="search-box" placeholder="搜索作品名称、作者..." id="searchInput">
                </div>

                <div class="gallery-grid" id="galleryGrid">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>

        <div class="charts-section">
            <div class="chart-card">
                <h3>时代分布</h3>
                <canvas id="dynastyChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>作者作品量 (TOP5)</h3>
                <canvas id="authorChart"></canvas>
            </div>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h2 class="modal-title" id="modalTitle">作品名称</h2>
            <div class="modal-body">
                <div class="modal-image">
                    <img id="modalImage" src="" alt="">
                </div>
                <div class="modal-info" id="modalInfo">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let paintingsData = [];
        let filteredData = [];

        // 加载数据
        fetch('/api/shinu52')
            .then(res => res.json())
            .then(data => {
                paintingsData = data;
                filteredData = [...data];
                renderGallery();
                renderCharts();
            });

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = filteredData.map(p => `
                <div class="painting-card" onclick="showDetail('${p.id}')">
                    <div class="painting-image">
                        <img src="${p.thumbnail_url}" alt="${p.title}" onerror="this.style.display='none'; this.parentElement.innerHTML=' ';">
                        ${p.num_persons > 0 ? `<span class="person-badge">${p.num_persons}个人物</span>` : ''}
                    </div>
                    <div class="painting-info">
                        <div class="painting-title">${p.title}</div>
                        <div class="painting-meta">${p.author} · ${p.institution}</div>
                        <span class="painting-dynasty">${p.dynasty}</span>
                        ${p.copyright === '是' ? '<span class="copyright-badge">公开版权</span>' : ''}
                    </div>
                </div>
            `).join('');
            document.getElementById('resultCount').textContent = filteredData.length;
        }

        // 切换筛选区域展开/收起
        function toggleSection(el) {
            el.classList.toggle('expanded');
            const options = el.nextElementSibling;
            options.classList.toggle('show');
        }

        // 应用所有筛选条件
        function applyFilters() {
            filteredData = paintingsData.filter(p => {
                // 朝代筛选
                const dynastyCheckboxes = document.querySelectorAll('[data-filter="dynasty"]:checked');
                if (dynastyCheckboxes.length > 0) {
                    const selectedDynasties = Array.from(dynastyCheckboxes).map(cb => cb.value);
                    if (!selectedDynasties.includes(p.dynasty)) {
                        return false;
                    }
                }

                // 版权筛选
                const copyrightCheckboxes = document.querySelectorAll('[data-filter="copyright"]:checked');
                if (copyrightCheckboxes.length > 0) {
                    const selectedCopyright = Array.from(copyrightCheckboxes).map(cb => cb.value);
                    if (!selectedCopyright.includes(p.copyright)) {
                        return false;
                    }
                }

                // 作者筛选
                const authorCheckboxes = document.querySelectorAll('[data-filter="author"]:checked');
                if (authorCheckboxes.length > 0) {
                    const selectedAuthors = Array.from(authorCheckboxes).map(cb => cb.value);
                    if (!selectedAuthors.includes(p.author) && !selectedAuthors.includes('其他')) {
                        return false;
                    }
                }

                // 机构筛选
                const institutionCheckboxes = document.querySelectorAll('[data-filter="institution"]:checked');
                if (institutionCheckboxes.length > 0) {
                    const selectedInstitutions = Array.from(institutionCheckboxes).map(cb => cb.value);
                    const inst = p.institution || '未知';
                    if (!selectedInstitutions.includes(inst) && !selectedInstitutions.includes('其他')) {
                        return false;
                    }
                }

                // 搜索筛选
                const keyword = document.getElementById('searchInput').value.toLowerCase();
                if (keyword && !p.title.toLowerCase().includes(keyword) && !p.author.toLowerCase().includes(keyword)) {
                    return false;
                }

                return true;
            });
            renderGallery();
        }

        // 重置所有筛选
        function resetAllFilters() {
            document.querySelectorAll('.filter-option input').forEach(cb => {
                cb.checked = true;
            });
            document.getElementById('searchInput').value = '';
            applyFilters();
        }

        function renderCharts() {
            // 朝代
            const dynastyCount = {};
            paintingsData.forEach(p => {
                dynastyCount[p.dynasty] = (dynastyCount[p.dynasty] || 0) + 1;
            });
            new Chart(document.getElementById('dynastyChart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(dynastyCount),
                    datasets: [{
                        data: Object.values(dynastyCount),
                        backgroundColor: ['#8b4513', '#d2691e']
                    }]
                }
            });

            // 作者
            const authorCount = {};
            paintingsData.forEach(p => {
                authorCount[p.author] = (authorCount[p.author] || 0) + 1;
            });
            const topAuthors = Object.entries(authorCount)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);
            new Chart(document.getElementById('authorChart'), {
                type: 'bar',
                data: {
                    labels: topAuthors.map(a => a[0]),
                    datasets: [{
                        data: topAuthors.map(a => a[1]),
                        backgroundColor: '#8b4513'
                    }]
                },
                options: { indexAxis: 'y' }
            });
        }

        function showDetail(id) {
            const p = paintingsData.find(item => item.id === id);
            if (p) {
                document.getElementById('modalTitle').textContent = p.title;
                document.getElementById('modalImage').src = p.thumbnail_url;
                document.getElementById('modalInfo').innerHTML = `
                    <div class="modal-field"><label>作者</label><span>${p.author}</span></div>
                    <div class="modal-field"><label>时代</label><span>${p.dynasty}</span></div>
                    <div class="modal-field"><label>收藏机构</label><span>${p.institution}</span></div>
                    <div class="modal-field"><label>检测人物数</label><span>${p.num_persons}</span></div>
                    <div class="modal-field"><label>检测标签</label>
                        <div class="modal-labels">${p.labels.map(l => `<span class="modal-label">${l}</span>`).join('')}</div>
                    </div>
                `;
                document.getElementById('detailModal').classList.add('show');
            }
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('show');
        }

        // 搜索
        document.getElementById('searchInput').addEventListener('input', function() {
            applyFilters();
        });

        // 初始化：展开第一个筛选区域
        document.addEventListener('DOMContentLoaded', function() {
            const firstTitle = document.querySelector('.filter-title');
            if (firstTitle) {
                firstTitle.click();
            }
        });
    </script>
</body>
</html>
